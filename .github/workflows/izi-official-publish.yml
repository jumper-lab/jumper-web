name: Publicar IZI Gym no oficial (janela aprovada)
on:
  schedule:
    - cron: '1 3 1 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validar pacote ou publicar na janela aprovada
        type: choice
        options: [validate, publish]
        default: validate
  pull_request:
    paths:
      - '.github/workflows/izi-official-publish.yml'
      - 'ops/izi-publish-watch/**'
      - 'jumper - construtor-de-sites/_jumper-sites-system/clientes/izigym*/**'
      - 'jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante/**'
permissions:
  contents: read
concurrency:
  group: izi-official-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false
env:
  TZ: America/Sao_Paulo
  npm_config_fetch_retries: '2'
  npm_config_fetch_retry_mintimeout: '5000'
  npm_config_fetch_retry_maxtimeout: '15000'
jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: 'jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante/package-lock.json'
      - run: npm ci
      - run: npm run build:cloudflare && node scripts/stage-izi-release.mjs
      - run: node --test scripts/tests/live-promotion.test.mjs scripts/tests/izi-release.test.mjs scripts/tests/rodeio-wordpress-preview.test.mjs
      - run: python3 -B -m unittest discover -s ops/izi-publish-watch -p 'test_*.py' -v
        working-directory: .
      - run: node scripts/validate-izi-release.mjs
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante
    steps:
      - name: Verificar janela da publicação
        working-directory: .
        run: |
          if [ "$(date +%F)" != '2026-11-01' ] || [ "$(date +%H%M)" -lt '0001' ]; then
            echo 'Fora da janela aprovada. Nenhum deploy autorizado.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: 'jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante/package-lock.json'
      - name: Instalar dependências do hoster
        run: npm ci
      - name: Publicar IZI dev no oficial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IZI_RELEASE_REPORT: ${{ runner.temp }}/izi-release.json
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Credencial Cloudflare ausente.' >&2; exit 1; }
          npm run deploy:cloudflare -- --promote=izi-official-2026-11-01
      - name: Registrar resultado factual
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT: ${{ runner.temp }}/izi-release.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['REPORT'])
          r=json.loads(p.read_text()) if p.exists() else {'phase':'janela, checkout ou instalação','publicationAttempted':False}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Publicação IZI\n\nResultado: '+os.environ['JOB_STATUS']+'\n\nFase: '+r['phase']+'\n\n')
            f.write('Versões registradas no artefato. Nenhum rollback automático foi executado.\n' if r.get('publicationAttempted') else 'Deploy não iniciado.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izi-release-result
          path: ${{ runner.temp }}/izi-release.json
          if-no-files-found: ignore
