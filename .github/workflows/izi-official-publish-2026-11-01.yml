name: Publicar IZI Gym no oficial

on:
  # GitHub Actions usa UTC. 03:01 UTC = 00:01 em America/Sao_Paulo.
  schedule:
    - cron: '1 3 * * 0'
  workflow_dispatch:

concurrency:
  group: izi-official-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: America/Sao_Paulo
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verificar janela da publicação
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%Y-%m-%d)" = "2026-11-01" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Fora da janela única de publicação; nenhuma alteração foi feita.'
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante/package-lock.json'

      - name: Instalar dependências do hoster
        if: steps.window.outputs.run == 'true'
        working-directory: jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante
        run: npm ci

      - name: Publicar IZI dev no oficial
        if: steps.window.outputs.run == 'true'
        working-directory: jumper - construtor-de-sites/_jumper-sites-system/clientes/rodeio-restaurante
        run: npm run deploy:cloudflare
