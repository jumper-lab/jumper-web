<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumper Studio - Briefing Quiz</title>
    <meta name="briefing-api" content="/api/briefings" />
    <link rel="canonical" href="https://site.jumper.dev.br/briefing" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="status-panel" aria-label="Resumo do quiz">
        <div class="brand-block">
          <img class="brand-logo" src="./assets/jumper-jp.png" alt="Jumper" />
          <div>
            <p class="eyebrow">Jumper Studio</p>
            <h1>Briefing do seu site</h1>
            <p class="brand-line">Conte o essencial. A Jumper cuida dos próximos passos.</p>
          </div>
        </div>

        <section class="progress-overview" aria-label="Seu progresso">
          <header class="progress-overview-header">
            <span><i aria-hidden="true"></i>Seu progresso</span>
            <strong id="summary-score">1/9</strong>
          </header>
          <div class="progress-card">
            <span id="step-count">Etapa 1 de 9</span>
            <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
          </div>
          <ol id="progress-steps" class="progress-steps"></ol>
        </section>
        <p id="draft-status" class="draft-status" role="status"></p>
      </aside>

      <section class="quiz-panel" aria-label="Perguntas do briefing">
        <form id="quiz-form" novalidate>
          <div id="step-container"></div>

          <footer class="actions">
            <button class="icon-button" id="prev-button" type="button" aria-label="Voltar etapa">
              <span aria-hidden="true">←</span>
            </button>
            <button class="ghost-button" id="save-button" type="button">Salvar para depois</button>
            <button class="primary-button" id="next-button" type="button">Continuar</button>
          </footer>
        </form>
      </section>
    </main>

    <script src="./quiz.js"></script>
  </body>
</html>
